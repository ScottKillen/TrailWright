# Purpose:      Pinned versions and build properties for TrailWright.
# Dependencies: build.gradle reads every key below.
#
# Versions confirmed 2026-10-24 against meta.fabricmc.net and maven.fabricmc.net.
# Re-run /verify-versions before changing any of them.

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# --- Minecraft / Fabric -------------------------------------------------------
minecraft_version=1.20.1
# Dev-only loader. Pinned to the 0.19 line Sinytra Connector bundles (0.19.3) so dev and
# Forge-via-Connector see the same loader behavior; 0.20.x is newer but untested there.
loader_version=0.19.5
# Matches the Fabric API base of the newest Forgified Fabric API for Forge 1.20.1
# (0.92.6+1.11.15+1.20.1), so dev never compiles against something Connector lacks.
# Newest upstream is 0.92.12+1.20.1.
fabric_api_version=0.92.6+1.20.1
# Loom 1.18+ requires JDK 25 to run Gradle; 1.17.x runs on JDK 21. Loom 1.17 was built
# with Gradle 9.5 and fixes 9.6 deprecations, so the wrapper is pinned to 9.6.1.
loom_version=1.17.21

# --- Optional integrations (compile-time only) --------------------------------
# Newest Mod Menu for 1.20.1 (maven.terraformersmc.com and Modrinth, checked 2026-10-25).
modmenu_version=7.2.2

# --- Mod ----------------------------------------------------------------------
mod_version=1.0.0
maven_group=us.someguy
archives_base_name=trailwright
